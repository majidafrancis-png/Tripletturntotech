<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Triple T Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
    <style>
        :root {
            --ttt-dark: #1A1A1A;
            --ttt-blue: #0072BC;
            --ttt-green: #7DB942;
            --ttt-teal-grad: linear-gradient(90deg, #7DB942 0%, #0096D6 100%);
            --ttt-light: #F8F9FA;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(160deg, #f0f9ff 0%, #f7fbf2 50%, #e8f5ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative background circles */
        body::before {
            content: '';
            position: fixed;
            width: 600px; height: 600px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(125,185,66,0.1), rgba(0,150,214,0.1));
            top: -250px; right: -200px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 350px; height: 350px; border-radius: 50%;
            background: linear-gradient(135deg, rgba(0,150,214,0.08), rgba(125,185,66,0.08));
            bottom: -130px; left: -100px;
            pointer-events: none;
        }

        /* ─── CARD ─── */
        .login-card {
            background: white;
            border-radius: 24px;
            padding: 48px 44px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            position: relative;
            z-index: 1;
        }

        /* Top gradient bar */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: var(--ttt-teal-grad);
            border-radius: 24px 24px 0 0;
        }

        /* ─── LOGO ─── */
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 32px;
            text-decoration: none;
        }

        .logo-icon {
            width: 52px; height: 52px; border-radius: 12px;
            background: linear-gradient(135deg, #7DB942, #0096D6);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 800; color: white;
            letter-spacing: -1px; flex-shrink: 0;
        }

        .logo-text { line-height: 1.15; }

        .logo-wordmark {
            font-size: 16px; font-weight: 700;
            letter-spacing: 0.5px; color: var(--ttt-dark);
        }

        .logo-wordmark .turn { color: var(--ttt-blue); }
        .logo-wordmark .tech { color: var(--ttt-green); }

        .logo-tagline {
            font-size: 10px; font-weight: 400; color: #888;
            letter-spacing: 2px; text-transform: uppercase;
        }

        /* ─── HEADING ─── */
        .login-heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-heading h1 {
            font-size: 22px; font-weight: 800;
            color: var(--ttt-dark); letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .login-heading p {
            font-size: 13px; color: #888;
        }

        /* ─── FORM ─── */
        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12.5px; font-weight: 600;
            color: #444; margin-bottom: 7px;
            letter-spacing: 0.2px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap iconify-icon {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            color: #aaa; font-size: 16px;
            pointer-events: none;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13.5px;
            color: var(--ttt-dark);
            background: #fdfdfd;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--ttt-blue);
            box-shadow: 0 0 0 3px rgba(0,114,188,0.1);
            background: white;
        }

        .eye-toggle {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #aaa;
            transition: color 0.2s;
        }

        .eye-toggle:hover { color: var(--ttt-blue); }

        /* ─── FORGOT ─── */
        .forgot-row {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 20px;
        }

        .forgot-row a {
            font-size: 12px; font-weight: 500;
            color: var(--ttt-blue); text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-row a:hover { color: var(--ttt-green); }

        /* ─── RECAPTCHA ─── */
        .recaptcha-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* ─── BUTTONS ─── */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px;
            background: var(--ttt-teal-grad);
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 14px; font-weight: 700;
            border: none; border-radius: 30px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(0,114,188,0.25);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(0,114,188,0.35);
        }

        .btn-secondary {
            display: block;
            width: 100%;
            padding: 13px;
            background: white;
            color: var(--ttt-blue);
            font-family: 'Poppins', sans-serif;
            font-size: 14px; font-weight: 600;
            border: 2px solid var(--ttt-blue);
            border-radius: 30px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }

        .btn-secondary:hover {
            background: var(--ttt-blue);
            color: white;
        }

        /* ─── DIVIDER ─── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0;
            color: #ccc;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1; height: 1px;
            background: #eee;
        }

        /* ─── BACK LINK ─── */
        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            font-size: 12.5px; color: #888;
            text-decoration: none; transition: color 0.2s;
            display: inline-flex; align-items: center; gap: 4px;
        }

        .back-link a:hover { color: var(--ttt-blue); }

        /* ─── ERROR ─── */
        .error-msg {
            color: #e63946;
            font-size: 13px; font-weight: 500;
            text-align: center; margin-top: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">

        <!-- Logo -->
        <a href="index.html" class="login-logo">
            <div class="logo-icon">T³</div>
            <div class="logo-text">
                <div class="logo-wordmark">
                    <span class="turn">TURN</span><span>TO</span><span class="tech">TECH</span>
                </div>
                <div class="logo-tagline">Academy</div>
            </div>
        </a>

        <!-- Heading -->
        <div class="login-heading">
            <h1>Welcome Back 👋</h1>
            <p>Sign in to access your portal</p>
        </div>

        <!-- Form -->
        <form method="POST">

            <div class="form-group">
                <label for="username">Username, Email or Phone</label>
                <div class="input-wrap">
                    <iconify-icon icon="ph:user-bold"></iconify-icon>
                    <input type="text" id="username" name="username" placeholder="Enter your username or email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <iconify-icon icon="ph:lock-bold"></iconify-icon>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <iconify-icon icon="ph:eye-bold" class="eye-toggle" id="togglePassword"></iconify-icon>
                </div>
            </div>

            <div class="forgot-row">
                <a href="forgot_password.php">Forgot Password?</a>
            </div>

            <div class="recaptcha-wrap">
                <div class="g-recaptcha" data-sitekey="6Les_0csAAAAAOJlE6sd-wYQo_9yaN2OD6mUiED_"></div>
            </div>

            <button type="submit" class="btn-primary">Login</button>

            <div class="divider">or</div>

            <a href="signup.php" class="btn-secondary">Create an Account</a>

        </form>

        <div class="back-link">
            <a href="index.html">
                <iconify-icon icon="ph:arrow-left-bold"></iconify-icon>
                Back to homepage
            </a>
        </div>

    </div>

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script>
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        let visible = false;

        toggleBtn.addEventListener('click', function () {
            visible = !visible;
            passwordInput.type = visible ? 'text' : 'password';
            toggleBtn.setAttribute('icon', visible ? 'ph:eye-slash-bold' : 'ph:eye-bold');
        });
    </script>

</body>
</html>
